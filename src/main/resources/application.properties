spring.application.name=seonggon_restaurant_be

spring.config.import=optional:classpath:application-local.properties

# 배포 환경에서는 DB_URL/DB_USERNAME/DB_PASSWORD 환경변수로 덮어씁니다.
# 로컬 개발 중에는 지금처럼 아무것도 안 해도 기존 값 그대로 동작해요.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seonggong_restaurant?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 배포 서버가 지정해주는 포트를 사용 (없으면 로컬처럼 8080)
server.port=${PORT:8080}

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 아래 줄을 삭제하세요 — 더 이상 필요 없습니다
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.web.socket=TRACE
logging.level.org.springframework.messaging=TRACE

# 로그
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 영상 업로드 디렉토리
signbridge.video.upload-dir=./videos

# Multipart 파일 크기 제한
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# API Keys (실제 값은 application-local.properties에)
anthropic.api.key=${ANTHROPIC_API_KEY}
openai.api.key=${OPENAI_API_KEY}
google.client.id=${GOOGLE_CLIENT_ID}
google.gemini.api.key=${GEMINI_API_KEY}

naver.client.id=${NAVER_CLIENT_ID}
naver.client.secret=${NAVER_CLIENT_SECRET}

# 토스페이먼츠 테스트 연동 — 아래 키는 사장님 계정 키가 아니라, 토스가 결제위젯(widgets API)
# 테스트용으로 공식 문서에 공개해둔 키예요 (이름 중간에 gck가 있는 게 결제위젯 전용 키라는 표시예요).
# 사업자등록 후 "전자결제 신청"을 하시면 그때 개발자센터에서 사장님만의 결제위젯 연동 키로 바꿀 수 있어요.
# 지금 계정에 있는 "API 개별 연동 키"(중간에 ck만 있는 키)는 결제창(payment()) 방식 전용이라
# widgets() API에는 안 맞아서 이 공용 테스트 키를 대신 씁니다.
# 시크릿 키는 절대 여기 직접 넣지 말고, application-local.properties(gitignore됨)에 넣어주세요.
toss.client-key=${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
toss.secret-key=${TOSS_SECRET_KEY:}

# 사장님 전용 관리자 화면 비밀번호 — 실제 운영 시 반드시
# application-local.properties에 ADMIN_PASSWORD로 강한 비밀번호를 넣어주세요.
# (기본값 admin1234는 개발/테스트용이라 그대로 배포하면 안 돼요.)
admin.password=${ADMIN_PASSWORD:admin1234}